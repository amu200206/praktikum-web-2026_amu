<body>

    <header>
        <h1>Formulir Kontak</h1>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="resume.html">Resume</a></li>

            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>Kirimkan Pesan atau Penawaran Proyek</h2>
            <form>

                <p>
                    <label for="nama_pengirim">Nama Lengkap Anda:</label><br>
                    <input type="text" id="nama_pengirim" name="nama_pengirim">
                </p>

                <p>
                    <label for="email_pengirim">Alamat Email:</label><br>
                    <input type="email" id="email_pengirim" name="email_pengirim">
                </p>

                <p>
                    <label for="jenis_layanan">Layanan yang dibutuhkan:</label><br>
                    <select id="jenis_layanan" name="jenis_layanan">
                        <option value="">-- Pilih Layanan --</option>
                        <option value="web">Pembuatan Web</option>
                        <option value="app">Pengembangan Aplikasi</option>
                        <option value="other">Lain-lain</option>
                    </select>
                </p>

                <p>
                    <label for="pesan">Pesan:</label><br>
                    <textarea id="pesan" name="pesan" rows="6"></textarea>
                </p>

                <p>
                    <button type="submit">Kirim Pesan</button>
                    <button type="reset">Batal / Reset</button>
                </p>
            </form>
        </section>
    </main>

    <hr>
